<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Cluely control-pill style, adapted to the coach. Spec values verbatim:
     fill rgba(20,20,24,0.65), hairline rgba(255,255,255,0.10),
     inner top inset rgba(255,255,255,0.06), key badges 22px r6 rgba(255,255,255,0.13),
     hover rgba(255,255,255,0.08), text #fff / rgba(255,255,255,0.6).
     Real desktop blur = Win11 dark acrylic behind this transparent page. */
  :root{
    --fill: rgba(20,20,24,0.83);
    --hairline: rgba(255,255,255,0.10);
    --inner-top: rgba(255,255,255,0.06);
    --text: #ffffff;
    --text-2: rgba(255,255,255,0.6);
    --badge: rgba(255,255,255,0.13);
    --badge-border: rgba(255,255,255,0.10);
    --hover: rgba(255,255,255,0.08);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100vw; height:100vh; background:transparent; overflow:hidden;
    font-family:'Segoe UI Variable Text','Segoe UI',Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; color:var(--text); user-select:none; }
  .card{
    position:absolute; left:0; right:0; bottom:0; height:80px;
    background:var(--fill);
    backdrop-filter: blur(35px) saturate(140%);
    -webkit-backdrop-filter: blur(35px) saturate(140%);
    border:1px solid var(--hairline);
    box-shadow: inset 0 1px 0 var(--inner-top);
    overflow:hidden;
    transition: border-radius .18s ease, clip-path .28s cubic-bezier(.22,1,.36,1);
  }
  /* The BUBBLE itself grows. In bar mode the card is ALWAYS the full open height
     (80 bar + 320 menu = 400) and bottom-anchored. With the menu closed the window
     is only 80px tall, so the card's top is off-screen AND clip-path hides it down
     to the bar. Opening retracts the clip, so the dark frosted bubble visibly grows
     UPWARD into the space the window opened (GPU clip-path, no layout thrash, and
     fixed px so it never re-animates when the window snaps). The 80/320/400 must
     match watch.ps1 Apply-Strip's Px 80 bar + Px 320 menu reserve. */
  body.pill .card{ height:40px; border-radius:999px; clip-path:none; }
  body.bar  .card{ height:400px; border-radius:24px; clip-path: inset(320px 0 0 0 round 24px); }
  body.bar.menu-open .card{ clip-path: inset(0 0 0 0 round 24px); }
  /* pill<->bar: fade the INCOMING layer in. The outgoing layer goes display:none
     instantly (via body.bar/body.pill), so there is never a crushed/stretched
     mismatched-size layer mid-transition. The window snaps instantly (PowerShell);
     the .card morphs its border-radius over .18s. */
  #barUI.mode-in, #pillUI.mode-in{ animation: uiFade .17s cubic-bezier(.4,0,.2,1); }
  @keyframes uiFade{ from{ opacity:0; } to{ opacity:1; } }

  /* cursor-tracking light shift */
  #sheen{ position:absolute; width:280px; height:280px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,0.11) 0%, rgba(255,255,255,0.045) 45%, rgba(255,255,255,0) 70%);
    transform:translate(-140px,-140px); opacity:0; transition:opacity .25s ease; }
  .card:hover #sheen{ opacity:1; }

  /* ---------- modes ---------- */
  #barUI,#pillUI{ position:absolute; inset:0; display:none; }
  body.bar #barUI{ display:flex; flex-direction:column; justify-content:flex-end; }
  body.pill #pillUI{ display:flex; flex-direction:row; align-items:center; }

  /* ---------- shared ---------- */
  .dot{ width:9px; height:9px; border-radius:50%; background:#969aa2; flex:0 0 auto;
    transition:background .25s ease; }
  .dot.pulse{ animation:breathe 1.7s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:.4; } 50%{ opacity:1; } }
  .status{ font-size:13.5px; font-weight:600; letter-spacing:.1px; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  /* Cluely-style quiet icon button: no box, soft rounded hover fill */
  .ghost{
    height:30px; min-width:30px; padding:0 6px; border-radius:9px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:rgba(255,255,255,0.72); background:transparent;
    transition:background .16s ease, color .16s ease, transform .18s ease;
  }
  .ghost:hover{ background:var(--hover); color:rgba(255,255,255,0.95); transform:scale(1.1); }
  .ghost:active{ background:rgba(255,255,255,0.12); transform:scale(0.94); }
  .ghost svg{ display:block; transition:transform .18s ease; }
  .ghost:hover svg{ transform:scale(1.22); }
  .ghost:active svg{ transform:scale(1.05); }
  .ghost .alt-i{ display:none; }
  .ghost.alt .pri-i{ display:none; }
  .ghost.alt .alt-i{ display:block; }
  .key{
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
    min-width:22px; height:22px; padding:0 5px;
    background:var(--badge); border:1px solid var(--badge-border); border-radius:6px;
    font-size:12px; color:rgba(255,255,255,0.92);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .divider{ width:1px; height:18px; background:rgba(255,255,255,0.12); flex:0 0 auto; }

  /* ---------- bar: row 1 (the control pill row) ---------- */
  #row1{ height:44px; display:flex; align-items:center; gap:12px; padding:2px 14px 0 9px; }
  #pauseBtn{
    width:32px; height:32px; border-radius:50%; background:#fff; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .18s ease;
  }
  #pauseBtn:hover{ transform:scale(1.07); }
  #pauseBtn:active{ transform:scale(0.93); }
  #pauseBtn svg{ transition:transform .18s ease; }
  #pauseBtn:hover svg{ transform:scale(1.18); }
  #pauseBtn .alt-i{ display:none; }
  #pauseBtn.alt .pri-i{ display:none; }
  #pauseBtn.alt .alt-i{ display:block; }
  .eq{ display:flex; align-items:flex-end; gap:2.5px; height:14px; flex:0 0 auto; }
  .eq i{ width:2.5px; background:rgba(255,255,255,0.85); border-radius:2px; animation:eq 1.1s ease-in-out infinite; }
  .eq i:nth-child(1){ height:6px; }
  .eq i:nth-child(2){ height:12px; animation-delay:.15s; }
  .eq i:nth-child(3){ height:8px; animation-delay:.3s; }
  .eq i:nth-child(4){ height:13px; animation-delay:.45s; }
  .eq i:nth-child(5){ height:5px; animation-delay:.6s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(.55);} 50%{ transform:scaleY(1);} }
  .eq.live i{ animation:none; transition:transform .12s ease; transform-origin:bottom; }
  body.paused .eq i{ animation-play-state:paused; opacity:.35; }
  .listenLbl{ display:none; align-items:center; gap:5px; flex:0 0 auto; font-size:12px; font-weight:600; color:#34d399; letter-spacing:.2px; }
  .listenLbl::before{ content:''; width:7px; height:7px; border-radius:50%; background:#34d399; animation:lpulse 1s ease-in-out infinite; }
  body.listening .listenLbl{ display:inline-flex; }
  body.listening .eq i{ background:#34d399; }
  @keyframes lpulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.35; transform:scale(.65); } }
  #timer{ font-variant-numeric:tabular-nums; font-size:13.5px; color:var(--text);
    min-width:42px; flex:0 0 auto; }
  #row1 .status{ flex:1 1 auto; cursor:pointer; }
  #chipMore.alt{ color:rgba(255,255,255,0.95); }

  /* ---------- bar: overflow menu (opens upward) ---------- */
  /* Menu is ALWAYS display:flex (it lives inside #barUI, which is display:none in
     pill mode, so it never shows on the initial pill state). The dark bubble reveal
     is done by the .card clip-path growth above; the menu just holds the rows and
     gates pointer-events so the closed (clipped) menu is not clickable. */
  #menu{
    display:flex; flex:1 1 auto; min-height:0; flex-direction:column; gap:2px;
    padding:8px 8px 4px 8px; overflow-y:auto;
    pointer-events:none;
  }
  body.menu-open #menu{ pointer-events:auto; }
  /* Row cascade (GPU: opacity + translateY only -- never scale, no text squash).
     Keep background/color in the transition so the hover fill still fades. */
  #menu .menu-row{
    opacity:0; transform: translateY(8px);
    transition: opacity .18s ease, transform .22s cubic-bezier(.22,1,.36,1), background .16s ease, color .16s ease;
  }
  body.menu-open #menu .menu-row{ opacity:1; transform: translateY(0); }
  /* OPEN stagger anchored to the BOTTOM (nth-last-child) so it survives row-count
     changes and reads bottom-up to match the upward-growing window. */
  body.menu-open #menu .menu-row:nth-last-child(1){ transition-delay:.02s; }
  body.menu-open #menu .menu-row:nth-last-child(2){ transition-delay:.05s; }
  body.menu-open #menu .menu-row:nth-last-child(3){ transition-delay:.08s; }
  body.menu-open #menu .menu-row:nth-last-child(4){ transition-delay:.11s; }
  body.menu-open #menu .menu-row:nth-last-child(5){ transition-delay:.14s; }
  body.menu-open #menu .menu-row:nth-last-child(6){ transition-delay:.17s; }
  body.menu-open #menu .menu-row:nth-last-child(7){ transition-delay:.19s; }
  body.menu-open #menu .menu-row:nth-last-child(n+8){ transition-delay:.21s; }
  /* CLOSE: kill all per-row delay so rows fade together fast and nothing lingers
     past the retracting clip (no chopped fade). */
  body:not(.menu-open) #menu .menu-row{ transition-delay:0s; }

  @media (prefers-reduced-motion: reduce){
    #menu, #menu .menu-row, #barUI, #pillUI{ transition-duration:.001s !important; }
    #menu .menu-row{ transform:none !important; }
  }
  .menu-row{
    display:flex; align-items:center; gap:10px; height:32px; flex:0 0 auto;
    padding:0 8px 0 10px; border-radius:9px; cursor:pointer;
    color:rgba(255,255,255,0.82);
    transition:background .16s ease, color .16s ease;
  }
  .menu-row:hover{ background:var(--hover); color:rgba(255,255,255,0.95); }
  .menu-row:active{ background:rgba(255,255,255,0.12); }
  .menu-row .m-ico{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; width:18px; height:18px; }
  .menu-row .m-ico svg{ display:block; }
  .menu-row .m-lbl{ flex:1 1 auto; font-size:13px; font-weight:600; letter-spacing:.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* action row chevron (signals "opens something"; no on/off switch) */
  .menu-row .m-chev{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; width:18px; height:18px; color:rgba(255,255,255,0.42); transition:color .16s ease, transform .16s ease; }
  .menu-row:hover .m-chev{ color:rgba(255,255,255,0.7); transform:translateX(2px); }
  .sw{
    flex:0 0 auto; width:34px; height:18px; border-radius:999px;
    background:rgba(255,255,255,0.16); position:relative;
    transition:background .16s ease;
  }
  .sw::after{
    content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
    background:#fff; transition:transform .16s ease;
  }
  .menu-row.on .sw{ background:#22c55e; }
  .menu-row.on .sw::after{ transform:translateX(16px); }
  .menu-row.on .m-ico{ color:#22c55e; }

  /* volume slider row (non-toggle): label on left, range on right */
  .menu-row.slider{ cursor:default; }
  .menu-row.slider:hover{ background:transparent; color:rgba(255,255,255,0.82); }
  .menu-row.slider:active{ background:transparent; }
  .menu-row .m-rng{
    flex:0 0 auto; width:96px; height:18px; -webkit-appearance:none; appearance:none;
    background:transparent; cursor:pointer; margin:0;
  }
  .menu-row .m-rng::-webkit-slider-runnable-track{
    height:4px; border-radius:999px; background:rgba(255,255,255,0.16);
  }
  .menu-row .m-rng::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; margin-top:-5px;
    width:14px; height:14px; border-radius:50%; background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,0.35);
  }
  .menu-row .m-rng:focus{ outline:none; }

  /* ---------- bar: row 2 ---------- */
  #row2{ height:36px; display:flex; align-items:center; gap:12px; padding:0 14px 6px 16px; }
  #askWrap{
    flex:1 1 auto; height:30px; display:flex; align-items:center; gap:8px; min-width:0;
    background:var(--hover); border-radius:10px;
    padding:0 7px 0 12px; transition:background .2s ease;
  }
  #askWrap:focus-within{ background:rgba(255,255,255,0.12); }
  #ask{
    flex:1 1 auto; min-width:0; background:transparent; border:none; outline:none;
    color:var(--text); font-size:13.5px; font-family:inherit;
  }
  #ask::placeholder{ color:var(--text-2); }
  #assist{
    flex:0 0 auto; height:30px; padding:0 16px; border-radius:15px; border:none;
    background:#fff; color:#141418; font-weight:600; font-size:13.5px; font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:7px; cursor:pointer;
    transition:transform .18s ease;
  }
  #assist:hover{ transform:scale(1.05); }
  #assist:active{ transform:scale(0.95); }
  #assist:disabled{ opacity:.7; cursor:default; transform:none; }
  .spin{ width:13px; height:13px; border-radius:50%; flex:0 0 auto;
    border:2px solid rgba(20,20,24,0.25); border-top-color:#141418;
    animation:spin .9s linear infinite; display:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  body.busy .spin{ display:block; }
  #stopBtn{ display:none; }
  body.busy #stopBtn{ display:flex; }

  /* ---------- pill ---------- */
  #pillUI{ gap:11px; padding:0 9px 0 17px; cursor:pointer; }
  #pillUI .status{ flex:1 1 auto; font-size:13px; }
</style>
</head>

    <div id="sheen"></div>

    <!-- ============ BAR ============ -->
    <div id="barUI">
      <!-- overflow menu: toggles live here, opens upward above the bar -->
      <div id="menu">
        <div class="menu-row" id="rowFlash" title="Flashcards - review your due flashcards and quiz yourself">

      </div>
      <div id="row1">
        <div id="pauseBtn" class="act" data-k="pause" title="Pause coaching">
          <svg class="pri-i" width="11" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="3.2" height="9" rx="1.2" fill="#141418"/><rect x="7.3" y="1.5" width="3.2" height="9" rx="1.2" fill="#141418"/></svg>

        </div>
        <div class="eq"><i></i><i></i><i></i><i></i><i></i></div>

        <div class="ghost" id="chipMore" title="More toggles">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="19" cy="12" r="1.7" fill="currentColor"/></svg>

        <div class="ghost act" id="chipMute" data-k="mute" title="Mute the coach voice">
          <svg class="pri-i" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9c1 .8 1.6 1.8 1.6 3s-.6 2.2-1.6 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M17.8 6.6c1.7 1.3 2.7 3.2 2.7 5.4s-1 4.1-2.7 5.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <svg class="alt-i" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z" fill="currentColor"/><path d="M16 9.5l4 4M20 9.5l-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </div>
        <div class="ghost act" data-k="note" title="Note this - flag what I'm doing now to revisit and practice later">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M14.5 3l6.5 6.5-2.2 2.2-.9-.3-3.8 3.8.3 2.5-1.6 1.6-4.2-4.2L4 19.7 3.3 19l4.6-4.6-4.2-4.2 1.6-1.6 2.5.3 3.8-3.8-.3-.9L14.5 3z" fill="currentColor"/></svg>
        </div>
        <div class="ghost act" data-k="kick" title="Kick-start - a kick in the pants to get going on this sheet (hint, not the answer)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 3h5v8.2l4.6 3.3H21a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H6a3 3 0 0 1-3-3c0-.9.4-1.7 1.1-2.3L9 11V3z" fill="currentColor"/><path d="M17 7.5l3-1.5M17.5 10l3.2-.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </div>
        <div class="ghost act" data-k="why" title="Why this cell - explain the concept and reasoning behind the cell I'm on (teaches the why, not the answer)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2.5a6.5 6.5 0 0 0-4 11.6c.7.6 1.1 1.2 1.2 2l.1 1.3h5.4l.1-1.3c.1-.8.5-1.4 1.2-2A6.5 6.5 0 0 0 12 2.5z" fill="currentColor"/><path d="M9.4 20.3h5.2M10.1 22.3h3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <div class="ghost act" data-k="cheat" title="Cheat sheet - drop a quick-reference card (the rules + categories for this topic) into your sheet, off to the side">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M7 9h10M7 12h10M7 15h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <div class="ghost act" data-k="audit" title="Check my sheet - deep audit of every formula against the goal">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="3.5" width="15" height="17" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8.5 12.5l2.4 2.4 4.8-5.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="ghost act" data-k="practice" title="Practice - review your due flashcards and quiz yourself (spaced repetition)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="6.5" y="3.5" width="13" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M6.5 6.5L4 7.7v11.3a1.5 1.5 0 0 0 2.1 1.4l8.4-3.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 8.5h6M10 11.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <div class="ghost act" data-k="demopractice" title="Demo + practice - build a NEW sheet tab from what you're working on: a worked example (filled) on the left, a blank practice version (highlighted) on the right, all formatted">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="4.5" width="7.5" height="15" rx="1.4" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="4.5" width="7.5" height="15" rx="1.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 8h3.5M5 11h3.5M5 14h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M15.5 8h3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </div>
        <div class="ghost act" data-k="undo" title="Undo - revert the coach's last edit to your sheet (puts back exactly what was there)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 7h6a4.5 4.5 0 0 1 0 9h-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 3.4 5 7l4 3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="ghost act" data-k="collapse" title="Collapse to a pill">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </div>
        <div class="ghost act" data-k="close" title="Close coach">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
      </div>
      <div id="row2">
        <div id="askWrap">
          <input id="ask" type="text" placeholder="Ask me anything - I can see your screen + Excel" spellcheck="false">
          <span class="key">&#8629;</span>
        </div>
        <button id="assist" title="Assist - answers your question, or reads your screen + Excel if the box is empty">
          <span class="spin"></span><span>Assist</span>
        </button>
        <div id="stopBtn" class="ghost act" data-k="cancel" title="Stop - cancel what the coach is doing">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="#ef4444"/></svg>
        </div>
      </div>
    </div>

    <!-- ============ PILL ============ -->
    <div id="pillUI" title="Expand the coach bar">
      <span class="dot pulse" id="dotPill"></span>
      <span class="status" id="statusPill"></span>
      <div class="ghost" id="pillExpand" title="Expand the coach bar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>

<script>
  const post = (o) => { try { window.chrome.webview.postMessage(JSON.stringify(o)); } catch(e){} };
  const $ = (id) => document.getElementById(id);

  window.XC = {
    setMode(m){
      const toBar = (m === 'bar');
      const changed = (document.body.classList.contains('bar') !== toBar);
      // collapsing to pill: ALWAYS drop the menu + cancel any pending close so a stale
      // {menu:false} can never fire after collapse (covers the close-timer orphan case).
      if (!toBar){
        document.body.classList.remove('menu-open');
        $('chipMore').classList.remove('alt');
        menuWant = false;
        if (menuCloseTimer){ clearTimeout(menuCloseTimer); menuCloseTimer = null; }
      }
      document.body.classList.toggle('bar', toBar);
      document.body.classList.toggle('pill', !toBar);
      if (!changed) return;
      // fade the incoming layer in; the outgoing is display:none now -> no smear/crush
      const inEl = $(toBar ? 'barUI' : 'pillUI');
      if (this._modeTimer){ clearTimeout(this._modeTimer); this._modeTimer = null; }
      inEl.classList.remove('mode-in'); void inEl.offsetWidth; inEl.classList.add('mode-in');
      this._modeTimer = setTimeout(() => { inEl.classList.remove('mode-in'); this._modeTimer = null; }, 240);
    },
    setStatus(t){ $('statusBar').textContent = t; $('statusPill').textContent = t; },
    setDot(hex, pulse){
      for (const d of [$('dotBar'), $('dotPill')]){
        d.style.background = hex;
        d.classList.toggle('pulse', !!pulse);
      }
    },
    setTimer(t){ $('timer').textContent = t; },
    setEq(v){
      const eq = document.querySelector('.eq'); if (!eq) return;
      if (v === null || v < 0){ eq.classList.remove('live'); [...eq.children].forEach(b => b.style.transform = ''); return; }
      eq.classList.add('live');
      const m = [0.7, 1.0, 0.85, 1.0, 0.6];
      [...eq.children].forEach((b, i) => {
        const s = 0.22 + Math.min(1, v * m[i] * (0.85 + 0.3 * Math.random())) * 0.78;
        b.style.transform = 'scaleY(' + s.toFixed(2) + ')';
      });
    },
    setToggle(k, on){
      if (k === 'pause'){ $('pauseBtn').classList.toggle('alt', !!on); document.body.classList.toggle('paused', !!on);
        $('pauseBtn').title = on ? 'Resume coaching' : 'Pause coaching'; }
      // menu toggle rows: mute, micmute, sound, hands, teach, format, guide
      const rows = { micmute:'rowMicMute', sound:'rowSound', hands:'rowHands', teach:'rowTeach', format:'rowFormat', guide:'rowGuide' };
      if (rows[k]){ const r = $(rows[k]); if (r) r.classList.toggle('on', !!on); }
      // keep working for any matching chip still on the bar
      const chips = { mute:'chipMute', sound:'chipSound', hands:'chipHands', teach:'chipTeach', format:'chipFormat' };
      if (chips[k]){ const c = $(chips[k]); if (c) c.classList.toggle('alt', !!on); }
    },
    busy(b){ document.body.classList.toggle('busy', !!b); $('assist').disabled = !!b; },
    setListening(on){ document.body.classList.toggle('listening', !!on); },
    setVol(n){ const r = $('volRange'); if (r) r.value = Math.max(0, Math.min(100, Number(n))); },
    getAsk(){ return $('ask').value; }
  };

  document.querySelectorAll('.act').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); post({type:'act', k: el.dataset.k}); });
  });
  $('statusBar').addEventListener('click', (e) => { e.stopPropagation(); post({type:'act', k:'reopen'}); });

  /* voice volume slider: report 0-100 on every input change */
  $('volRange').addEventListener('input', (e) => { post({type:'vol', value: Number(e.target.value)}); });
  $('volRange').addEventListener('pointerdown', (e) => { e.stopPropagation(); });

  /* overflow menu open/close.
     OPEN:  post {menu:true} FIRST so PowerShell snaps the window tall instantly;
            the dark inset:0 .card already fills it (no acrylic flash). Then add
            menu-open on the 2nd rAF so the clip-path wipe reveals into real space.
     CLOSE: run the reverse wipe NOW (window stays tall), then post {menu:false}
            only after MENU_CLOSE_MS so PowerShell never shrinks under live content. */
  const MENU_CLOSE_MS = 340;   /* >= card clip-path .28s + margin (window must not shrink mid-grow) */
  let menuCloseTimer = null;
  let menuWant = false;        /* the user's LATEST intent (not the rAF-deferred class) */
  let pendingOpen = false;     /* waiting for the host window to actually grow before revealing */
  function revealMenu(){ if (menuWant){ requestAnimationFrame(() => { if (menuWant) document.body.classList.add('menu-open'); }); } }
  /* Start the bubble-grow only AFTER the host window has actually resized taller, so
     the clip never animates inside the old (short) window and then jump when it grows. */
  window.addEventListener('resize', () => {
    if (pendingOpen && window.innerHeight > 160){ pendingOpen = false; revealMenu(); }
  });
  function setMenu(open){
    open = !!open;
    if (menuWant === open) return;   /* compare intent, so a fast re-tap can't latch */
    menuWant = open;
    if (menuCloseTimer){ clearTimeout(menuCloseTimer); menuCloseTimer = null; }
    $('chipMore').classList.toggle('alt', open);
    if (open){
      pendingOpen = true;
      post({type:'menu', open:true});
      /* fallback: if no resize event arrives (already tall), reveal anyway */
      setTimeout(() => { if (pendingOpen && menuWant){ pendingOpen = false; revealMenu(); } }, 220);
    } else {
      pendingOpen = false;
      document.body.classList.remove('menu-open');
      menuCloseTimer = setTimeout(() => {
        menuCloseTimer = null;
        if (!menuWant) post({type:'menu', open:false});   /* skip if a reopen won the race */
      }, MENU_CLOSE_MS);
    }
  }
  $('chipMore').addEventListener('click', (e) => {
    e.stopPropagation();
    setMenu(!menuWant);
  });
  /* Flashcards action row: start the flashcard session, then close the menu */
  $('rowFlash').addEventListener('click', (e) => {
    e.stopPropagation();
    setMenu(false);
    post({type:'act', k:'practice'});
  });
  /* Excel exercise action row: start a hands-on Workout drill, then close menu */
  $('rowExcel').addEventListener('click', (e) => {
    e.stopPropagation();
    setMenu(false);
    post({type:'act', k:'workout'});
  });
  // close when clicking anything that is not the menu or the more button
  document.addEventListener('pointerdown', (e) => {
    if (!menuWant) return;
    if (e.target.closest('#menu, #chipMore')) return;
    setMenu(false);
  }, true);
  function sendAsk(){
    const q = $('ask').value.trim();
    $('ask').value = '';
    post({type:'ask', q});
  }
  $('assist').addEventListener('click', (e) => { e.stopPropagation(); sendAsk(); });
  $('ask').addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); sendAsk(); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') post({type:'panel', k:'close'}); });

  $('pillUI').addEventListener('click', () => { if (!dragged) post({type:'act', k:'expand'}); });

  let dragOn = false, dragged = false, lx = 0, ly = 0;
  const interactive = (t) => t.closest('.ghost, .act, #askWrap, #assist, #pauseBtn, .status');
  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || interactive(e.target)) return;
    dragOn = true; dragged = false; lx = e.screenX; ly = e.screenY;
  });
  document.addEventListener('pointermove', (e) => {
    if (!dragOn) return;
    const dx = e.screenX - lx, dy = e.screenY - ly;
    if (!dragged && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
    dragged = true; lx = e.screenX; ly = e.screenY;
    post({type:'drag', dx, dy});
  });
  document.addEventListener('pointerup', () => { dragOn = false; setTimeout(() => dragged = false, 0); });

  /* cursor-tracking light shift */
  const sheen = $('sheen');
  document.addEventListener('mousemove', (e) => {
    sheen.style.transform = 'translate(' + (e.clientX - 140) + 'px,' + (e.clientY - 140) + 'px)';
  });

  XC.setStatus('Listening to the lesson');
  post({type:'ready'});
</script>
</body>
</html>
