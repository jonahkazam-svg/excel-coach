<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Dark Cluely liquid glass answer panel - real blur from the Win11 acrylic behind. */
  :root{
    --fill: rgba(20,20,24,0.55);
    --hairline: rgba(255,255,255,0.10);
    --inner-top: rgba(255,255,255,0.06);
    --text: rgba(255,255,255,0.92);
    --text-2: rgba(255,255,255,0.6);
    --badge: rgba(255,255,255,0.13);
    --accent: #8ab4ff;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100vw; height:100vh; background:transparent; overflow:hidden;
    font-family:'Segoe UI Variable Text','Segoe UI',Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; color:var(--text); user-select:none; }
  .card{
    position:absolute; inset:0; border-radius:20px;
    background:var(--fill);
    backdrop-filter: blur(35px) saturate(140%);
    -webkit-backdrop-filter: blur(35px) saturate(140%);
    border:1px solid var(--hairline);
    box-shadow: inset 0 1px 0 var(--inner-top);
    overflow:hidden; display:flex; flex-direction:column;
  }
  #sheen{ position:absolute; width:300px; height:300px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 45%, rgba(255,255,255,0) 70%);
    transform:translate(-150px,-150px); opacity:0; transition:opacity .25s ease; z-index:0; }
  .card:hover #sheen{ opacity:1; }

  /* ---------- header ---------- */
  #hdr{ height:42px; flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:0 12px 0 18px; border-bottom:1px solid rgba(255,255,255,0.08); z-index:1; }
  #hdr .title{ font-size:13.5px; font-weight:600; color:var(--text-2); }
  #clock{ margin-left:auto; font-family:Consolas,'Cascadia Mono',monospace; font-size:12px;
    color:rgba(255,255,255,0.45); font-variant-numeric:tabular-nums; }
  .chip{
    width:28px; height:28px; border-radius:8px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:var(--badge); border:1px solid var(--hairline);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    color:rgba(255,255,255,0.85);
    transition:background .15s ease, transform .15s ease;
  }
  .chip:hover{ background:rgba(255,255,255,0.20); transform:scale(1.08); }
  .chip:active{ transform:scale(0.94); }
  .chip svg{ display:block; }

  /* ---------- body ---------- */
  #body{ flex:1 1 auto; overflow-y:auto; padding:16px 20px; z-index:1;
    font-size:14.5px; line-height:1.55; color:var(--text); user-select:text; cursor:default; }
  #body::-webkit-scrollbar{ width:8px; }
  #body::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.18); border-radius:4px; }
  #body::-webkit-scrollbar-track{ background:transparent; }
  #body h1{ font-size:19px; font-weight:700; color:#fff; margin:4px 0 10px; }
  #body h2{ font-size:16.5px; font-weight:650; color:#fff; margin:4px 0 9px; }
  #body p{ margin:0 0 10px; }
  #body b{ color:#fff; font-weight:650; }
  #body .li{ display:flex; gap:9px; margin:0 0 7px; }
  #body .li .pre{ flex:0 0 auto; color:var(--text-2); }
  #body .li .pre.num{ color:var(--accent); font-weight:650; }
  #body .li .cnt{ flex:1 1 auto; }

  /* spinner (centered) */
  #spinWrap{ position:absolute; inset:42px 0 36px 0; display:none; align-items:center; justify-content:center; z-index:2; }
  body.loading #spinWrap{ display:flex; }
  body.loading #body{ visibility:hidden; }
  .ring{ width:40px; height:40px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.15); border-top-color:rgba(255,255,255,0.85);
    animation:spin .9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- footer ---------- */
  #ftr{ height:36px; flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:0 14px; z-index:1; }
  #explain{
    height:24px; padding:0 12px; border-radius:12px; border:1px solid var(--hairline);
    background:var(--badge); color:rgba(255,255,255,0.85);
    font-size:12px; font-family:inherit; cursor:pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    transition:background .15s ease, transform .15s ease;
  }
  #explain:hover{ background:rgba(255,255,255,0.20); transform:scale(1.04); }
  #esc{ margin-left:auto; font-size:11.5px; color:rgba(255,255,255,0.4); }
</style>
</head>
<body>
  <div class="card">
    <div id="sheen"></div>
    <div id="hdr">
      <span class="title">Coach</span>
      <span id="clock">--:--</span>
      <div class="chip" id="copyBtn" title="Copy answer">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </div>
      <div class="chip" id="closeBtn" title="Close (Esc)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div id="body"></div>
    <div id="spinWrap"><div class="ring"></div></div>
    <div id="ftr">
      <button id="explain" title="Re-answer with the full reasoning and steps">Explain in detail</button>
      <span id="esc">Esc to close</span>
    </div>
  </div>

<script>
  const post = (o) => { try { window.chrome.webview.postMessage(JSON.stringify(o)); } catch(e){} };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const bold = (s) => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

  function mdToHtml(md){
    const out = [];
    let para = [];
    const flush = () => { if (para.length){ out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
    for (const raw of String(md).replace(/\r\n/g,'\n').split('\n')){
      const line = raw;
      const t = line.trim();
      if (t === ''){ flush(); continue; }
      let m;
      if ((m = t.match(/^(#{1,6})\s+(.*)$/))){
        flush();
        const tag = m[1].length <= 1 ? 'h1' : 'h2';
        out.push('<' + tag + '>' + bold(esc(m[2].replace(/\*\*/g,''))) + '</' + tag + '>');
      } else if ((m = t.match(/^[-*+]\s+(.*)$/))){
        flush();
        out.push('<div class="li"><span class="pre">&#8226;</span><span class="cnt">' + bold(esc(m[1])) + '</span></div>');
      } else if ((m = t.match(/^(\d+)\.\s+(.*)$/))){
        flush();
        out.push('<div class="li"><span class="pre num">' + m[1] + '.</span><span class="cnt">' + bold(esc(m[2])) + '</span></div>');
      } else {
        para.push(bold(esc(t)));
      }
    }
    flush();
    return out.join('');
  }

  window.XC = {
    setAnswer(md){
      document.body.classList.remove('loading');
      $('body').innerHTML = mdToHtml(md);
      $('body').scrollTop = 0;
    },
    setAnswerLoading(){ document.body.classList.add('loading'); },
    setTime(t){ $('clock').textContent = t; }
  };

  $('copyBtn').addEventListener('click', () => post({type:'panel', k:'copy'}));
  $('closeBtn').addEventListener('click', () => post({type:'panel', k:'close'}));
  $('explain').addEventListener('click', () => post({type:'panel', k:'explain'}));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') post({type:'panel', k:'close'}); });

  /* drag on non-interactive background */
  let dragOn = false, lx = 0, ly = 0;
  const interactive = (t) => t.closest('.chip, #explain, #body');
  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || interactive(e.target)) return;
    dragOn = true; lx = e.screenX; ly = e.screenY;
  });
  document.addEventListener('pointermove', (e) => {
    if (!dragOn) return;
    const dx = e.screenX - lx, dy = e.screenY - ly;
    if (dx === 0 && dy === 0) return;
    lx = e.screenX; ly = e.screenY;
    post({type:'drag', dx, dy});
  });
  document.addEventListener('pointerup', () => { dragOn = false; });

  const sheen = $('sheen');
  document.addEventListener('mousemove', (e) => {
    sheen.style.transform = 'translate(' + (e.clientX - 150) + 'px,' + (e.clientY - 150) + 'px)';
  });

  XC.setTime(new Date().toTimeString().slice(0,5));
  post({type:'ready'});
</script>
</body>
</html>
