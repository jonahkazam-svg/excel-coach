<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Cluely "AI response" panel style, adapted to the coach.
     fill rgba(20,20,24,0.55), hairline + inner top highlight, radius 20,
     24px padding, ghost icons, query chip, hover rgba(255,255,255,0.08) r10. */
  :root{
    --fill: rgba(20,20,24,0.83);
    --hairline: rgba(255,255,255,0.10);
    --inner-top: rgba(255,255,255,0.06);
    --text: rgba(255,255,255,0.92);
    --text-2: rgba(255,255,255,0.6);
    --hover: rgba(255,255,255,0.08);
    --accent: #8ab4ff;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100vw; height:100vh; background:transparent; overflow:hidden;
    font-family:'Segoe UI Variable Text','Segoe UI',Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; color:var(--text); user-select:none; }
  .card{
    position:absolute; inset:0; border-radius:20px;
    background:var(--fill);
    backdrop-filter: blur(35px) saturate(140%);
    -webkit-backdrop-filter: blur(35px) saturate(140%);
    border:1px solid var(--hairline);
    box-shadow: inset 0 1px 0 var(--inner-top);
    overflow:hidden; display:flex; flex-direction:column;
    padding:20px 24px 14px;
  }
  #sheen{ position:absolute; width:320px; height:320px; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.035) 45%, rgba(255,255,255,0) 70%);
    transform:translate(-160px,-160px); opacity:0; transition:opacity .25s ease; }
  .card:hover #sheen{ opacity:1; }
  #hdr,#body,#ftr{ position:relative; z-index:1; }

  /* ---------- header (like "AI response" + query chip + icons) ---------- */
  #hdr{ flex:0 0 auto; display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  #hdr .title{ font-size:15.5px; font-weight:600; color:#fff; flex:0 0 auto; }
  .chip{
    display:flex; align-items:center; gap:7px; min-width:0; flex:0 1 auto;
    background:var(--hover); border:1px solid var(--hairline);
    border-radius:16px; padding:4px 12px; font-size:12.5px; color:rgba(255,255,255,0.85);
    white-space:nowrap; overflow:hidden;
  }
  .chip svg{ flex:0 0 auto; }
  .chip .q{ overflow:hidden; text-overflow:ellipsis; }
  .chip.hidden{ display:none; }
  #hdrIcons{ margin-left:auto; display:flex; align-items:center; gap:4px; flex:0 0 auto; }
  #clock{ font-variant-numeric:tabular-nums; font-size:12px; color:rgba(255,255,255,0.45); margin-right:6px; }
  .ghost{
    height:28px; min-width:28px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:rgba(255,255,255,0.72); background:transparent;
    transition:background .16s ease, color .16s ease, transform .18s ease;
  }
  .ghost:hover{ background:var(--hover); color:rgba(255,255,255,0.95); transform:scale(1.1); }
  .ghost:active{ background:rgba(255,255,255,0.12); transform:scale(0.94); }
  .ghost svg{ display:block; transition:transform .18s ease; }
  .ghost:hover svg{ transform:scale(1.22); }
  .ghost:active svg{ transform:scale(1.05); }

  /* ---------- history nav (back / forward + position) ---------- */
  #nav{ display:flex; align-items:center; gap:2px; flex:0 0 auto; }
  #nav .ghost.disabled{ opacity:0.28; pointer-events:none; cursor:default; }
  #navPos{ font-variant-numeric:tabular-nums; font-size:11.5px; color:rgba(255,255,255,0.5);
    min-width:30px; text-align:center; }
  #navPos.hidden{ display:none; }
  #navNew{ font-size:10px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase;
    color:var(--accent); margin-left:3px; opacity:0; transition:opacity .2s ease; flex:0 0 auto; }
  #navNew.show{ opacity:1; }

  /* ---------- status badge (top of body) ---------- */
  #badge{ display:flex; align-items:center; gap:6px; flex:0 0 auto; margin-bottom:11px;
    font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    padding:4px 10px; border-radius:8px; width:fit-content; }
  #badge.hidden{ display:none; }
  #badge svg{ flex:0 0 auto; display:block; }
  #badge.kind-issue{ color:#f5a623; background:rgba(245,166,35,0.14); border:1px solid rgba(245,166,35,0.4); }
  #badge.kind-fixed{ color:#22c55e; background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.45); }
  #badge.kind-guide{ color:var(--accent); background:rgba(138,180,255,0.13); border:1px solid rgba(138,180,255,0.38); }
  #badge.kind-note{ color:var(--text-2); background:rgba(255,255,255,0.07); border:1px solid var(--hairline); }

  /* ---------- body ---------- */
  #body{ flex:1 1 auto; overflow-y:auto; min-height:0; padding-right:6px;
    font-size:14px; line-height:1.55; color:var(--text); user-select:text; cursor:default; }
  #body::-webkit-scrollbar{ width:7px; }
  #body::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.16); border-radius:4px; }
  #body::-webkit-scrollbar-track{ background:transparent; }
  #body h1{ font-size:18px; font-weight:650; color:#fff; margin:2px 0 10px; }
  #body h2{ font-size:15.5px; font-weight:650; color:#fff; margin:2px 0 9px; }
  #body p{ margin:0 0 12px; }
  #body b{ color:#fff; font-weight:650; }
  #body b.term{ cursor:pointer; border-bottom:1px dashed rgba(138,180,255,0.45); transition:color .12s ease, border-color .12s ease; }
  #body b.term:hover{ color:#8ab4ff; border-bottom-color:#8ab4ff; }
  #body .li{ display:flex; gap:9px; margin:0 0 8px; }
  #body .li .pre{ flex:0 0 auto; color:var(--text-2); }
  #body .li .pre.num{ color:var(--accent); font-weight:650; }
  #body .li .cnt{ flex:1 1 auto; }
  #body table.md{ border-collapse:collapse; width:100%; margin:2px 0 12px; font-size:13px; }
  #body table.md th, #body table.md td{ border:1px solid rgba(255,255,255,0.14); padding:4px 8px; text-align:left; vertical-align:top; }
  #body table.md th{ background:rgba(255,255,255,0.06); color:#fff; font-weight:650; }

  /* spinner */
  #spinWrap{ position:absolute; inset:56px 0 44px 0; display:none; align-items:center; justify-content:center; }
  body.loading #spinWrap{ display:flex; }
  body.loading #body{ visibility:hidden; }
  .ring{ width:38px; height:38px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.15); border-top-color:rgba(255,255,255,0.85);
    animation:spin .9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- footer: action-row style ---------- */
  #ftr{ flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center; column-gap:6px; row-gap:2px; margin-top:8px; margin-left:-10px; }
  .fbtn{
    display:flex; align-items:center; gap:9px; min-width:0;
    padding:7px 10px; border-radius:10px; border:none; background:transparent;
    color:rgba(255,255,255,0.88); font-size:13px; font-family:inherit; cursor:pointer;
    transition:background .16s ease; white-space:nowrap;
  }
  .fbtn:hover{ background:var(--hover); }
  .fbtn.hidden{ display:none; }
  .fbtn .lbl{ overflow:hidden; text-overflow:ellipsis; }
  #esc{ margin-left:auto; font-size:11.5px; color:rgba(255,255,255,0.38); flex:0 0 auto; }

  /* ---------- formulas + identifiers drops ---------- */
  #fxBtn .fx{ font:italic 600 13.5px Georgia,'Times New Roman',serif; color:inherit; }
  #fxDrop, #idDrop{ position:absolute; top:52px; left:16px; right:16px; max-height:68%; overflow-y:auto; z-index:6;
    background:rgba(26,26,32,0.97); border:1px solid var(--hairline); border-radius:14px; padding:8px;
    box-shadow:0 14px 44px rgba(0,0,0,0.55); }
  #fxDrop.hidden, #idDrop.hidden{ display:none; }
  #fxDrop::-webkit-scrollbar, #idDrop::-webkit-scrollbar{ width:7px; }
  #fxDrop::-webkit-scrollbar-thumb, #idDrop::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.16); border-radius:4px; }
  .idcat{ font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--accent); padding:9px 10px 3px; }
  .fxhead{ font-size:11.5px; color:var(--text-2); padding:4px 10px 7px; }
  .fxrow{ padding:8px 10px; border-radius:9px; cursor:pointer; transition:background .14s ease; }
  .fxrow:hover{ background:var(--hover); }
  .fxname{ font-size:12.5px; font-weight:650; color:#fff; }
  .fxformula{ font:12px Consolas,monospace; color:var(--accent); margin-top:2px; word-break:break-all; }
  .fxnote{ font-size:11.5px; color:var(--text-2); margin-top:1px; }

  /* ---------- practice view (review + quiz) ---------- */
  #practice{ position:absolute; inset:0; z-index:7; border-radius:20px;
    background:var(--fill); padding:20px 24px 16px;
    display:none; flex-direction:column; }
  body.practice #practice{ display:flex; }
  body.practice .card > #hdr,
  body.practice .card > #body,
  body.practice .card > #ftr,
  body.practice .card > #fxDrop,
  body.practice .card > #idDrop,
  body.practice .card > #spinWrap{ display:none !important; }
  #pracHdr{ flex:0 0 auto; display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  #pracHdr .ptitle{ font-size:15.5px; font-weight:600; color:#fff; flex:0 0 auto; }
  #pracDue{
    display:flex; align-items:center; gap:7px; flex:0 1 auto; min-width:0;
    background:var(--hover); border:1px solid var(--hairline);
    border-radius:16px; padding:4px 12px; font-size:12.5px; color:rgba(255,255,255,0.85);
    white-space:nowrap; overflow:hidden;
  }
  #pracDue.hidden{ display:none; }
  #pracProgress{ margin-left:auto; font-variant-numeric:tabular-nums; font-size:12px;
    color:rgba(255,255,255,0.45); flex:0 0 auto; }
  #pracClose{
    height:28px; min-width:28px; border-radius:9px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:rgba(255,255,255,0.72); background:transparent;
    transition:background .16s ease, color .16s ease, transform .18s ease;
  }
  #pracClose:hover{ background:var(--hover); color:rgba(255,255,255,0.95); transform:scale(1.1); }
  #pracClose:active{ background:rgba(255,255,255,0.12); transform:scale(0.94); }

  #pracBody{ flex:1 1 auto; overflow-y:auto; min-height:0; padding-right:6px;
    display:flex; flex-direction:column; }
  #pracBody::-webkit-scrollbar{ width:7px; }
  #pracBody::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.16); border-radius:4px; }
  #pracBody::-webkit-scrollbar-track{ background:transparent; }

  .pcardType{ font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    color:var(--accent); margin-bottom:10px; flex:0 0 auto; }
  .pcardFront{ font-size:19px; font-weight:600; line-height:1.45; color:#fff;
    margin-bottom:14px; user-select:text; cursor:default; flex:0 0 auto; }
  .pcardBack{ font-size:15px; line-height:1.55; color:var(--text); user-select:text; cursor:default;
    border-top:1px solid var(--hairline); padding-top:13px; margin-bottom:6px; }
  .pcardBack.hidden{ display:none; }

  /* "Explain it simpler" helper - shown on every card, opens a plain-English box */
  #pracSimplify{
    display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
    margin-top:2px; margin-bottom:4px; padding:6px 11px; border-radius:9px;
    border:1px solid var(--hairline); background:var(--hover);
    color:var(--text-2); font-size:12.5px; font-weight:600; font-family:inherit;
    cursor:pointer; flex:0 0 auto; transition:background .16s ease, color .16s ease, border-color .16s ease;
  }
  #pracSimplify:hover{ background:rgba(255,255,255,0.13); color:#fff; border-color:rgba(255,255,255,0.22); }
  #pracSimplify svg{ flex:0 0 auto; opacity:0.85; }
  #pracSimplify.hidden{ display:none; }
  #pracHelp{
    margin-top:10px; padding:12px 13px; border-radius:11px;
    border:1px solid var(--hairline); background:rgba(120,170,255,0.07);
    font-size:14px; line-height:1.55; color:var(--text); user-select:text;
  }
  #pracHelp.hidden{ display:none; }
  #pracHelp .phelpHead{ font-size:11px; font-weight:700; letter-spacing:0.4px;
    text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  #pracHelp.loading{ color:var(--text-2); font-style:italic; }

  /* quiz answer verdict (Correct / Not quite) */
  #pracVerdict{ margin-top:13px; padding:9px 12px; border-radius:10px;
    font-size:14px; font-weight:700; letter-spacing:.2px; flex:0 0 auto; }
  #pracVerdict.hidden{ display:none; }
  #pracVerdict.ok{ background:rgba(34,197,94,0.14); color:#46d889; border:1px solid rgba(34,197,94,0.32); }
  #pracVerdict.no{ background:rgba(248,113,113,0.13); color:#f9a8a8; border:1px solid rgba(248,113,113,0.32); }

  /* end-of-session progress: what you're good at / need to work on */
  #pracPerf{ margin-top:16px; border-top:1px solid var(--hairline); padding-top:14px; }
  #pracPerf.hidden{ display:none; }
  .perfHead{ font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    color:var(--text-2); margin:0 0 7px; }
  .perfScore{ font-size:15px; color:#fff; font-weight:600; margin-bottom:13px; }
  .perfGroup{ margin-bottom:11px; }
  .perfLabel{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; margin-bottom:5px; }
  .perfLabel.good{ color:#46d889; }
  .perfLabel.work{ color:#f9a8a8; }
  .perfItem{ display:flex; justify-content:space-between; gap:10px; font-size:13px;
    color:var(--text); padding:3px 0; }
  .perfItem .pn{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .perfItem .pp{ flex:0 0 auto; color:var(--text-2); font-variant-numeric:tabular-nums; }

  /* Done / Next action bar for the Excel exercise (sits below the answer) */
  #workoutBar{ display:flex; gap:8px; flex:0 0 auto; padding:10px 0 2px; }
  #workoutBar.hidden{ display:none; }
  body.practice #workoutBar, body.loading #workoutBar{ display:none; }
  .wobtn{ flex:1 1 auto; padding:10px 12px; border-radius:10px; border:1px solid var(--hairline);
    background:var(--hover); color:#fff; font-size:13.5px; font-weight:600; font-family:inherit; cursor:pointer;
    transition:background .16s ease, border-color .16s ease; }
  .wobtn:hover{ background:rgba(255,255,255,0.13); }
  .wobtn.primary{ background:var(--accent); border-color:transparent; color:#0b0b0c; }
  .wobtn.primary:hover{ filter:brightness(1.08); }

  /* shared practice button rows */
  #pracActions{ flex:0 0 auto; margin-top:auto; padding-top:12px; }
  .pbtnRow{ display:flex; gap:8px; flex-wrap:wrap; }
  .pbtnRow.hidden{ display:none; }
  .pbtn{
    flex:1 1 auto; min-width:0; padding:10px 12px; border-radius:10px;
    border:1px solid var(--hairline); background:var(--hover);
    color:rgba(255,255,255,0.9); font-size:13px; font-weight:600; font-family:inherit;
    cursor:pointer; white-space:nowrap; text-align:center;
    transition:background .16s ease, border-color .16s ease, transform .12s ease;
  }
  .pbtn:hover{ background:rgba(255,255,255,0.13); }
  .pbtn:active{ transform:scale(0.97); }
  /* primary (Show answer / Next) */
  .pbtn.primary{ background:#fff; color:#141418; border-color:transparent; }
  .pbtn.primary:hover{ background:rgba(255,255,255,0.88); }
  /* rating colors */
  .pbtn.rate-again{ border-color:rgba(239,68,68,0.45); }
  .pbtn.rate-again:hover{ background:rgba(239,68,68,0.18); border-color:rgba(239,68,68,0.7); }
  .pbtn.rate-hard{ border-color:rgba(245,158,11,0.45); }
  .pbtn.rate-hard:hover{ background:rgba(245,158,11,0.18); border-color:rgba(245,158,11,0.7); }
  .pbtn.rate-good{ border-color:rgba(138,180,255,0.45); }
  .pbtn.rate-good:hover{ background:rgba(138,180,255,0.18); border-color:rgba(138,180,255,0.7); }
  .pbtn.rate-easy{ border-color:rgba(34,197,94,0.45); }
  .pbtn.rate-easy:hover{ background:rgba(34,197,94,0.18); border-color:rgba(34,197,94,0.7); }

  /* quiz choices */
  #pracChoices{ display:flex; flex-direction:column; gap:9px; margin:4px 0 6px; flex:0 0 auto; }
  #pracChoices.hidden{ display:none; }
  .pchoice{
    display:flex; align-items:flex-start; gap:10px; text-align:left;
    padding:11px 13px; border-radius:11px;
    border:1px solid var(--hairline); background:var(--hover);
    color:rgba(255,255,255,0.9); font-size:14px; font-family:inherit; cursor:pointer;
    transition:background .16s ease, border-color .16s ease;
  }
  .pchoice:hover:not(.locked){ background:rgba(255,255,255,0.13); }
  .pchoice .pkey{ flex:0 0 auto; font-weight:700; color:var(--text-2); }
  .pchoice .pval{ flex:1 1 auto; min-width:0; }
  .pchoice.locked{ cursor:default; }
  .pchoice.correct{ background:rgba(34,197,94,0.16); border-color:rgba(34,197,94,0.7); }
  .pchoice.correct .pkey{ color:#22c55e; }
  .pchoice.wrong{ background:rgba(239,68,68,0.16); border-color:rgba(239,68,68,0.7); }
  .pchoice.wrong .pkey{ color:#ef4444; }

  .pempty{ flex:1 1 auto; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; color:var(--text-2); gap:8px; padding:20px; }
  .pempty.hidden{ display:none; }
  .pempty .pemoji{ font-size:30px; opacity:0.7; }
  .pempty .pmsg{ font-size:15px; color:rgba(255,255,255,0.78); }
  .pempty .psub{ font-size:12.5px; color:var(--text-2); }

  /* ---------- exercise view (dedicated workout mode) ---------- */
  #exercise{ position:absolute; inset:0; z-index:7; border-radius:20px;
    background:var(--fill); padding:20px 24px 16px;
    display:none; flex-direction:column; }
  body.exercise #exercise{ display:flex; }
  body.exercise .card > #hdr,
  body.exercise .card > #badge,
  body.exercise .card > #body,
  body.exercise .card > #fxDrop,
  body.exercise .card > #idDrop,
  body.exercise .card > #workoutBar,
  body.exercise .card > #ftr,
  body.exercise .card > #spinWrap,
  body.exercise .card > #practice{ display:none !important; }

  #exHdr{ flex:0 0 auto; display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  #exHdr .extitle{ font-size:15.5px; font-weight:600; color:#fff; flex:0 0 auto; }
  #exProgress{ margin-left:auto; font-variant-numeric:tabular-nums; font-size:12px;
    color:rgba(255,255,255,0.45); flex:0 1 auto; min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; text-align:right; }
  #exScore{ font-variant-numeric:tabular-nums; font-size:12px;
    color:rgba(255,255,255,0.45); flex:0 0 auto; white-space:nowrap; text-align:right; }
  #exScore.hidden{ display:none; }
  #exEndBtn{
    flex:0 0 auto; padding:5px 12px; border-radius:9px;
    border:1px solid var(--hairline); background:var(--hover);
    color:rgba(255,255,255,0.85); font-size:12.5px; font-weight:600; font-family:inherit;
    cursor:pointer; transition:background .16s ease, color .16s ease, border-color .16s ease;
  }
  #exEndBtn:hover{ background:rgba(255,255,255,0.13); color:#fff; border-color:rgba(255,255,255,0.22); }

  #exBody{ flex:1 1 auto; overflow-y:auto; min-height:0; padding-right:6px;
    display:flex; flex-direction:column; }
  #exBody::-webkit-scrollbar{ width:7px; }
  #exBody::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.16); border-radius:4px; }
  #exBody::-webkit-scrollbar-track{ background:transparent; }

  /* concept callout - same soft look as #pracHelp */
  #exConcept{
    margin:0 0 14px; padding:12px 13px; border-radius:11px; flex:0 0 auto;
    border:1px solid var(--hairline); background:rgba(120,170,255,0.07);
    font-size:14px; line-height:1.55; color:var(--text); user-select:text;
  }
  #exConcept.hidden{ display:none; }
  #exConcept b{ color:#fff; font-weight:650; }

  #exPrompt{ font-size:19px; font-weight:600; line-height:1.45; color:#fff;
    margin-bottom:14px; user-select:text; cursor:default; flex:0 0 auto; }

  /* interactive multiple-choice for pill questions - reuses .pchoice look */
  #exChoices{ display:flex; flex-direction:column; gap:9px; margin:0 0 6px; flex:0 0 auto; }
  #exChoices.hidden{ display:none; }

  #exAnswer{ font-size:15px; line-height:1.55; color:var(--text); user-select:text; cursor:default;
    border-top:1px solid var(--hairline); padding-top:13px; margin-bottom:6px; flex:0 0 auto; }
  #exAnswer.hidden{ display:none; }

  /* result area - reuses the green/red verdict colors */
  #exResult{ margin-top:14px; padding:12px 14px; border-radius:11px; flex:0 0 auto;
    font-size:14px; line-height:1.55; color:var(--text); user-select:text;
    border:1px solid var(--hairline); background:rgba(255,255,255,0.05); }
  #exResult.hidden{ display:none; }
  #exResult .exResHead{ font-size:14px; font-weight:700; letter-spacing:.2px; margin-bottom:8px; }
  #exResult.ok{ background:rgba(34,197,94,0.10); border-color:rgba(34,197,94,0.32); }
  #exResult.ok .exResHead{ color:#46d889; }
  #exResult.no{ background:rgba(248,113,113,0.09); border-color:rgba(248,113,113,0.32); }
  #exResult.no .exResHead{ color:#f9a8a8; }

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M11.2 3.5H5.5a2 2 0 0 0-2 2v5.7a2 2 0 0 0 .59 1.42l7.79 7.79a2 2 0 0 0 2.83 0l5.69-5.69a2 2 0 0 0 0-2.83l-7.79-7.79a2 2 0 0 0-1.41-.6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/></svg>

    <div id="badge" class="hidden"></div>

    <!-- ============ PRACTICE (review + quiz) ============ -->

          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.5"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 17v.01M12 13.5c0-2 2.5-2.2 2.5-4.2A2.5 2.5 0 0 0 9.7 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/></svg>

<script>
  const post = (o) => { try { window.chrome.webview.postMessage(JSON.stringify(o)); } catch(e){} };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const bold = (s) => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  function isTermLike(t){
    t = String(t).trim().replace(/[.,:;!?]+$/,'');
    if (t.length < 3 || t.length > 40) return false;
    if (t.split(/\s+/).length > 5) return false;
    if (/^[A-Z]{1,3}\d{1,4}$/.test(t)) return false;        // cell ref like C39
    if (/^[\d.,%$\s()+\-x]+$/i.test(t)) return false;        // pure number / amount
    return true;
  }
  function wireTerms(){
    document.querySelectorAll('#body b').forEach(b => {
      const t = b.textContent.trim().replace(/[.,:;!?]+$/,'');
      if (isTermLike(t)){
        b.classList.add('term');
        b.title = 'Explain "' + t + '" in this context';
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          document.body.classList.add('loading');
          post({type:'panel', k:'define', term: t});
        });
      }
    });
  }

  function mdToHtml(md){
    const out = [];
    let para = [];
    const flush = () => { if (para.length){ out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
    let tbl = [];
    const flushTbl = () => {
      if (!tbl.length) return;
      const rows = tbl.map(r => r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c => c.trim()));
      const isSep = (cells) => cells.length>0 && cells.every(c => /^:?-{2,}:?$/.test(c.replace(/\s/g,'')));
      const body = rows.filter(r => !isSep(r));
      let h = '<table class="md">';
      body.forEach((cells, i) => { const tg = (i===0) ? 'th' : 'td'; h += '<tr>' + cells.map(c => '<'+tg+'>'+bold(esc(c))+'</'+tg+'>').join('') + '</tr>'; });
      out.push(h + '</table>'); tbl = [];
    };
    for (const raw of String(md).replace(/\r\n/g,'\n').split('\n')){
      const t = raw.trim();
      if (/^\|.*\|$/.test(t) && t.length > 2){ flush(); tbl.push(t); continue; }
      flushTbl();
      if (t === ''){ flush(); continue; }
      let m;
      if ((m = t.match(/^(#{1,6})\s+(.*)$/))){
        flush();
        const tag = m[1].length <= 1 ? 'h1' : 'h2';
        out.push('<' + tag + '>' + bold(esc(m[2].replace(/\*\*/g,''))) + '</' + tag + '>');
      } else if ((m = t.match(/^[-*+]\s+(.*)$/))){
        flush();
        out.push('<div class="li"><span class="pre">&#8226;</span><span class="cnt">' + bold(esc(m[1])) + '</span></div>');
      } else if ((m = t.match(/^(\d+)\.\s+(.*)$/))){
        flush();
        out.push('<div class="li"><span class="pre num">' + m[1] + '.</span><span class="cnt">' + bold(esc(m[2])) + '</span></div>');
      } else {
        para.push(bold(esc(t)));
      }
    }
    flush();
    flushTbl();
    return out.join('');
  }

  /* pick a key term from the answer's bold spans for the Define follow-up */
  let defineTerm = '';
  function pickTerm(md){
    const bolds = [...String(md).matchAll(/\*\*(.+?)\*\*/g)].map(m => m[1].trim());
    // never offer to define generic answer-phrasing ("current focus", "final answer"...)
    const stop = /^(current focus|focus|final answer|correct answer|the answer|answer|next step|next steps?|key terms?|important|note|tips?|remember|warning|step \d+|option [a-d]|[a-d]\)|yes|no|true|false|right|wrong|correct|incorrect|the fix|fix|goal|summary|result|results|in short|bottom line|takeaway|conclusion|why|how|what|done|good|this|that)$/i;
    // real course vocabulary beats whatever happens to be longest
    const fin = /(deprecia|amortiz|retained|earnings|ebitda|ebit|revenue|income|equity|asset|liabilit|cash flow|capex|opex|goodwill|interest|margin|accrual|wacc|dcf\b|irr\b|moic|npv\b|fcf|valuation|multiple|dividend|working capital|inventory|receivable|payable|gross profit|net income|balance sheet|statement|expense|tax|debt|salvage|book value|carrying|impair|leverage|enterprise value|equity value|terminal value|discount|yield|principal|covenant|tranche|synerg|accretion|dilut|roll[- ]?forward|nwc\b|pp&?e\b|capital|circular|sensitivit|scenario|comps?\b|precedent|lbo\b|merger|acquisition|share|stock|bond|coupon|cogs|sg&a|d&a\b)/i;
    const cand = bolds.filter(t =>
      t.length >= 3 && t.length <= 34 &&
      t.split(/\s+/).length <= 4 &&                 // a term, not a bolded sentence
      !/^[A-Z]{1,3}\d{1,4}$/.test(t) &&             // skip cell refs like C39
      !/^[\d.,%$\s()-]+$/.test(t) &&                // skip pure numbers
      !/[=]/.test(t) &&                             // skip formulas
      !/^(alt|ctrl|shift|win|fn|f\d{1,2})\b[-+ ]/i.test(t) &&  // skip keyboard shortcuts
      !/^([a-z\d][-+]){2,}[a-z\d]$/i.test(t) &&     // skip key sequences like Alt-H-F-S
      !stop.test(t.replace(/[.,:;!?]+$/,'')));
    if (!cand.length) return '';
    const hits = cand.filter(t => fin.test(t));
    const pool = hits.length ? hits : cand;
    pool.sort((a,b) => b.length - a.length);
    return pool[0].replace(/[.,:;!?]+$/,'');
  }

  let fxItems = [];
  function renderFx(items){
    fxItems = items || [];
    if (!fxItems.length){ $('fxList').innerHTML = '<div class="fxhead">No formulas yet - open a practice sheet first.</div>'; return; }
    $('fxList').innerHTML = '<div class="fxhead">Relevant to what you\'re doing - tap to copy</div>' + fxItems.map((it,i) =>
      '<div class="fxrow" data-i="'+i+'"><div class="fxname">'+esc(it.n||'')+'</div><div class="fxformula">'+esc(it.f||'')+'</div>'+(it.d?'<div class="fxnote">'+esc(it.d)+'</div>':'')+'</div>').join('');
    [...document.querySelectorAll('.fxrow')].forEach(r => r.addEventListener('click', () => {
      const it = fxItems[+r.dataset.i]; if(!it) return;
      post({type:'panel', k:'copytext', term: it.f});
      const nm = r.querySelector('.fxname'); const old = nm.textContent;
      nm.textContent = 'Copied!'; setTimeout(() => { try{ nm.textContent = old; }catch(e){} }, 900);
    }));
  }
  let idItems = [];
  function renderId(items){
    idItems = items || [];
    if (!idItems.length){ $('idList').innerHTML = '<div class="fxhead">Nothing to categorize yet - open a practice sheet first.</div>'; return; }
    let html = '<div class="fxhead">What contributes to what on this sheet</div>'; let lastCat = '';
    idItems.forEach(it => {
      if ((it.c||'') !== lastCat){ lastCat = it.c||''; html += '<div class="idcat">'+esc(lastCat)+'</div>'; }
      html += '<div class="fxrow"><div class="fxname">'+esc(it.n||'')+'</div>'+(it.d?'<div class="fxnote">'+esc(it.d)+'</div>':'')+'</div>';
    });
    $('idList').innerHTML = html;
  }
  /* ---------- practice (review + quiz) ---------- */
  var pracCard = null;      // current card object
  var pracMode = 'review';  // 'review' | 'quiz'
  var pracAnswered = false; // quiz: has a choice been chosen yet
  var exAnswered = false;   // exercise quiz: has a choice been chosen yet
  function showRow(id){
    ['pracShowRow','pracRateRow','pracNextRow','pracDoneRow'].forEach(function(r){
      $(r).classList.toggle('hidden', r !== id);
    });
  }
  function typeLabel(t){
    if (t === 'definition') return 'Definition';
    if (t === 'formula') return 'Formula';
    return 'Flashcard';
  }
  function renderEmpty(mode, dueCount, perf){
    $('pracCardType').classList.add('hidden');
    $('pracFront').classList.add('hidden');
    $('pracBack').classList.add('hidden');
    $('pracChoices').classList.add('hidden');
    $('pracSimplify').classList.add('hidden');
    $('pracHelp').classList.add('hidden');
    $('pracVerdict').classList.add('hidden');
    var emp = $('pracEmpty'); emp.classList.remove('hidden');
    // mode 'nodeck' = no deck built yet; otherwise caught up
    if (mode === 'nodeck'){
      $('pracEmptyEmoji').textContent = '[ ]';
      $('pracEmptyMsg').textContent = 'No deck yet - run build-deck.';
      $('pracEmptySub').textContent = 'Build your study deck to start practicing.';
    } else {
      $('pracEmptyEmoji').textContent = 'OK';
      $('pracEmptyMsg').textContent = 'No cards due - you are caught up.';
      $('pracEmptySub').textContent = 'Come back later or start a quiz.';
    }
    renderPerf(perf);
    showRow('pracDoneRow');
  }
  /* end-of-session scoreboard: overall %, strengths, and what to work on */
  function renderPerf(perf){
    var el = $('pracPerf');
    if (!perf || !perf.attempts){ el.classList.add('hidden'); el.innerHTML = ''; return; }
    function grp(label, cls, arr){
      if (!arr || !arr.length) return '';
      var s = '<div class="perfGroup"><div class="perfLabel ' + cls + '">' + label + '</div>';
      arr.forEach(function(t){
        s += '<div class="perfItem"><span class="pn">' + esc(String(t.name)) +
             '</span><span class="pp">' + t.pct + '%</span></div>';
      });
      return s + '</div>';
    }
    var h = '<div class="perfHead">Your progress</div>';
    h += '<div class="perfScore">' + perf.pct + '% correct over ' + perf.attempts +
         ' answer' + (perf.attempts === 1 ? '' : 's') + '</div>';
    h += grp('Solid', 'good', perf.strengths);
    h += grp('Work on these', 'work', perf.weaknesses);
    el.innerHTML = h;
    el.classList.remove('hidden');
  }
  function renderCard(mode, card){
    pracMode = mode; pracCard = card; pracAnswered = false;
    $('pracEmpty').classList.add('hidden');
    $('pracPerf').classList.add('hidden');
    $('pracCardType').classList.remove('hidden');
    $('pracFront').classList.remove('hidden');
    $('pracCardType').textContent = typeLabel(card.type);
    $('pracFront').textContent = String(card.front == null ? '' : card.front);
    var back = $('pracBack'), choices = $('pracChoices');
    if (mode === 'quiz'){
      // QUIZ: question + four clickable choices
      back.classList.add('hidden');
      choices.classList.remove('hidden');
      choices.innerHTML = '';
      var list = card.choices || [];
      list.forEach(function(text, i){
        var b = document.createElement('div');
        b.className = 'pchoice';
        b.dataset.i = i;
        b.innerHTML = '<span class="pkey">' + String.fromCharCode(65 + i) +
          '</span><span class="pval"></span>';
        b.querySelector('.pval').textContent = String(text == null ? '' : text);
        b.addEventListener('click', function(){ chooseQuiz(i); });
        choices.appendChild(b);
      });
      showRow('');           // no action row until answered
    } else {
      // REVIEW: front prominent, back hidden until "Show answer"
      choices.classList.add('hidden');
      back.classList.add('hidden');
      back.textContent = String(card.back == null ? '' : card.back);
      showRow('pracShowRow');
    }
    $('pracVerdict').classList.add('hidden');
    $('pracSimplify').classList.remove('hidden');
    var help = $('pracHelp'); help.classList.add('hidden'); help.classList.remove('loading'); help.innerHTML = '';
    $('pracBody').scrollTop = 0;
  }
  function chooseQuiz(choice){
    if (pracAnswered || !pracCard) return;
    pracAnswered = true;
    var answer = (typeof pracCard.answer === 'number') ? pracCard.answer : -1;
    [].forEach.call($('pracChoices').children, function(b){
      var i = +b.dataset.i;
      b.classList.add('locked');
      if (i === answer) b.classList.add('correct');
      else if (i === choice) b.classList.add('wrong');
    });
    // explicit verdict so it is obvious whether you got it right
    var ok = (choice === answer);
    var v = $('pracVerdict');
    v.classList.remove('hidden', 'ok', 'no');
    v.classList.add(ok ? 'ok' : 'no');
    if (ok){ v.textContent = 'Correct'; }
    else {
      var letter = (answer >= 0) ? String.fromCharCode(65 + answer) : '';
      v.textContent = letter ? ('Not quite - the answer is ' + letter) : 'Not quite';
    }
    // reveal the explanation (card back) so you learn the why, right or wrong
    if (pracCard.back){
      var bk = $('pracBack');
      bk.textContent = String(pracCard.back);
      bk.classList.remove('hidden');
    }
    post({type:'panel', k:'practice', action:'quizAnswer', cardId: pracCard.id, choice: choice});
    showRow('pracNextRow');
    $('pracBody').scrollTop = $('pracBody').scrollHeight;
  }
  /* exercise quiz: a choice click is the answer - post it and lock the choices */
  function chooseExercise(choice){
    if (exAnswered) return;
    exAnswered = true;
    [].forEach.call($('exChoices').children, function(b){
      b.classList.add('locked');
    });
    post({type:'panel', k:'workoutanswer', choice: choice});
  }
  function rateCard(quality){
    if (!pracCard) return;
    post({type:'panel', k:'practice', action:'rate', cardId: pracCard.id, quality: quality});
  }
  function closePractice(){
    document.body.classList.remove('practice');
    post({type:'panel', k:'practice', action:'practiceClose'});
  }

  /* ---------- history model ---------- */
  // each entry: { md, kind:'issue'|'answer'|'guide'|'note', id:<number>, status:'open'|'fixed' }
  var history = [];
  var cursor = -1;          // index into history currently displayed (-1 = nothing yet)

  var BADGE_CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none">' +
    '<path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // render only the badge for a given entry into #badge (no body re-render)
  function renderBadge(entry){
    var el = $('badge');
    el.className = '';           // reset all kind-* classes
    if (entry.kind === 'issue'){
      if (entry.status === 'fixed'){ el.className = 'kind-fixed'; el.innerHTML = BADGE_CHECK + 'Fixed'; }
      else { el.className = 'kind-issue'; el.textContent = 'Issue'; }
    } else if (entry.kind === 'guide'){
      el.className = 'kind-guide'; el.textContent = 'Next step';
    } else if (entry.kind === 'note'){
      el.className = 'kind-note'; el.textContent = 'Note';
    } else {
      el.className = 'hidden'; el.textContent = '';   // 'answer' -> no badge
    }
  }

  // render the body markdown (same pipeline setAnswer always used) + define follow-up
  function renderBody(md){
    $('fxDrop').classList.add('hidden');
    $('idDrop').classList.add('hidden');
    $('body').innerHTML = mdToHtml(md);
    $('body').scrollTop = 0;
    wireTerms();
    defineTerm = pickTerm(md);
    $('defineBtn').classList.toggle('hidden', !defineTerm);
    if (defineTerm){
      const short = defineTerm.length > 26 ? defineTerm.slice(0,25) + '...' : defineTerm;
      $('defineLbl').textContent = 'Define ' + short;
      $('defineBtn').title = 'Define "' + defineTerm + '" in the context of what you\'re working on';
    }
  }

  // show the history entry at index i (badge + body + nav state)
  function renderEntry(i){
    var entry = history[i];
    if (!entry) return;
    cursor = i;
    renderBadge(entry);
    renderBody(entry.md);
    updateNav();
  }

  // refresh arrow enabled/disabled state + "n / N" position indicator
  function updateNav(){
    var n = history.length;
    var pos = $('navPos'), back = $('navBack'), fwd = $('navFwd');
    if (n <= 0){ pos.classList.add('hidden'); back.classList.add('disabled'); fwd.classList.add('disabled'); return; }
    pos.classList.remove('hidden');
    pos.textContent = (cursor + 1) + ' / ' + n;
    back.classList.toggle('disabled', cursor <= 0);
    fwd.classList.toggle('disabled', cursor >= n - 1);
    // clear the "new" hint once the viewer is back at the newest entry
    if (cursor >= n - 1) $('navNew').classList.remove('show');
  }

  function navTo(i){
    if (i < 0 || i >= history.length || i === cursor) return;
    renderEntry(i);
  }

  window.XC = {
    /* watch.ps1 drives one card at a time:
       payload = { mode:"review"|"quiz", dueCount, index, total, card } */
    openPractice(payloadJson){
      var p;
      try { p = (typeof payloadJson === 'string') ? JSON.parse(payloadJson) : payloadJson; }
      catch(e){ p = {}; }
      p = p || {};
      document.body.classList.remove('loading');
      document.body.classList.add('practice');
      var mode = (p.mode === 'quiz') ? 'quiz' : 'review';
      $('pracTitle').textContent = (mode === 'quiz') ? 'Quiz' : 'Review';
      // header: "<dueCount> due today"
      var due = $('pracDue'), dc = p.dueCount;
      if (dc == null || dc < 0){ due.classList.add('hidden'); }
      else { due.classList.remove('hidden'); $('pracDueText').textContent = dc + ' due today'; }
      // progress: index/total (1-based display)
      var prog = $('pracProgress');
      if (p.total == null || p.total <= 0 || p.index == null){ prog.textContent = ''; }
      else { prog.textContent = (Math.min(p.index + 1, p.total)) + '/' + p.total; }
      // body
      if (!p.card){ renderEmpty(p.empty === 'nodeck' ? 'nodeck' : 'caughtup', dc, p.perf); }
      else { renderCard(mode, p.card); }
    },
    /* "Explain it simpler" - plain-English re-explanation of the current card */
    setCardHelpLoading(){
      var h = $('pracHelp');
      h.classList.remove('hidden'); h.classList.add('loading');
      h.textContent = 'Thinking of a simpler way to explain this...';
      $('pracBody').scrollTop = $('pracBody').scrollHeight;
    },
    setCardHelp(text){
      var h = $('pracHelp');
      h.classList.remove('hidden'); h.classList.remove('loading');
      var safe = bold(esc(String(text == null ? '' : text))).replace(/\n+/g, '<br>');
      h.innerHTML = '<div class="phelpHead">In plain English</div>' + safe;
      $('pracBody').scrollTop = $('pracBody').scrollHeight;
    },
    /* setAnswer(md) or setAnswer(md, { kind, id }) - pushes a history entry and
       renders it. meta is optional; with no meta it behaves like before
       (kind 'answer', id 0). */
    setAnswer(md, meta){
      document.body.classList.remove('loading');
      document.body.classList.remove('practice');
      var atNewest = (cursor >= history.length - 1);   // following live?
      history.push({
        md: md,
        kind: (meta && meta.kind) || 'answer',
        id: (meta && meta.id) || 0,
        status: 'open'
      });
      if (atNewest){
        // auto-advance to the new entry (live)
        renderEntry(history.length - 1);
      } else {
        // user is viewing an older entry - don't yank them forward
        updateNav();                       // just refresh the "n / N" count
        $('navNew').classList.add('show'); // subtle hint that something new arrived
      }
    },
    /* mark every issue entry with this id as fixed; live-update the badge if shown */
    markFixed(id){
      for (var i = 0; i < history.length; i++){
        var e = history[i];
        if (e.kind === 'issue' && e.id === id){
          e.status = 'fixed';
          if (i === cursor) renderBadge(e);   // currently displayed -> live badge swap
        }
      }
    },
    setAnswerLoading(){ document.body.classList.add('loading'); },
    setWorkoutBar(show){ $('workoutBar').classList.toggle('hidden', !show); },
    setTime(t){ $('clock').textContent = t; },
    setQuery(q){
      const has = q && q.length;
      $('qchip').classList.toggle('hidden', !has);
      if (has) $('qtext').textContent = q;
    },
    setFormulas(items){ renderFx(items); },
    setFormulasLoading(){ $('fxList').innerHTML = '<div class="fxhead">Looking at what you\'re working on...</div>'; },
    setIdents(items){ renderId(items); },
    setIdentsLoading(){ $('idList').innerHTML = '<div class="fxhead">Categorizing what\'s on your sheet...</div>'; },
    /* dedicated exercise mode - watch.ps1 drives one exercise at a time:
       payload = { mode:"excel"|"pill", title, topicName, progress, scoreboard,
                   prompt, concept, answer, choices } */
    openExercise(payloadJson){
      var p;
      try { p = (typeof payloadJson === 'string') ? JSON.parse(payloadJson) : payloadJson; }
      catch(e){ p = {}; }
      p = p || {};
      document.body.classList.remove('loading');
      document.body.classList.remove('practice');
      document.body.classList.add('exercise');
      var mode = (p.mode === 'pill') ? 'pill' : 'excel';
      $('exTitle').textContent = p.title || 'Exercise';
      $('exProgress').textContent = (p.topicName || '') + (p.progress ? ' - ' + p.progress : '');
      // scoreboard (right-aligned, muted) - hidden when empty
      var sc = $('exScore');
      var scoreText = String(p.scoreboard == null ? '' : p.scoreboard);
      if (scoreText){ sc.textContent = scoreText; sc.classList.remove('hidden'); }
      else { sc.textContent = ''; sc.classList.add('hidden'); }
      // prompt: bold + newlines preserved
      var prompt = String(p.prompt == null ? '' : p.prompt);
      $('exPrompt').innerHTML = bold(esc(prompt)).replace(/\n+/g, '<br>');
      // concept callout
      var con = $('exConcept');
      if (p.concept){
        con.innerHTML = '<b>What you are doing:</b> ' + esc(String(p.concept));
        con.classList.remove('hidden');
      } else { con.classList.add('hidden'); con.innerHTML = ''; }
      // always reset interactive choices + lock guard so a re-open starts fresh
      var ch = $('exChoices');
      ch.innerHTML = '';
      ch.classList.add('hidden');
      exAnswered = false;
      var choices = (p.choices && p.choices.length) ? p.choices : null;
      var ans = $('exAnswer');
      if (choices){
        // interactive multiple-choice: the click IS the answer
        choices.forEach(function(text, i){
          var b = document.createElement('div');
          b.className = 'pchoice';
          b.dataset.i = i;
          b.innerHTML = '<span class="pkey">' + String.fromCharCode(65 + i) +
            '</span><span class="pval"></span>';
          b.querySelector('.pval').textContent = String(text == null ? '' : text);
          b.addEventListener('click', function(){ chooseExercise(i); });
          ch.appendChild(b);
        });
        ch.classList.remove('hidden');
        // hide the answer line + check button - the choice click answers
        ans.classList.add('hidden'); ans.textContent = '';
        $('exCheckBtn').classList.add('hidden');
      } else if (mode === 'pill'){
        // answer line (definition / pill exercises only), no check button
        ans.textContent = 'Answer: ' + String(p.answer == null ? '' : p.answer);
        ans.classList.remove('hidden');
        $('exCheckBtn').classList.add('hidden');
      } else {
        ans.classList.add('hidden'); ans.textContent = '';
        $('exCheckBtn').classList.remove('hidden');
      }
      // always reset result + show Next
      var res = $('exResult');
      res.classList.add('hidden'); res.classList.remove('ok', 'no'); res.innerHTML = '';
      $('exNextBtn').classList.remove('hidden');
      $('exBody').scrollTop = 0;
    },
    /* grade the current exercise:
       payload = { correct:bool, md:string, correctIndex?:int, chosenIndex?:int }
       NOTE: this does NOT clear #exChoices - the locked choices stay visible. */
    showExerciseResult(payloadJson){
      var p;
      try { p = (typeof payloadJson === 'string') ? JSON.parse(payloadJson) : payloadJson; }
      catch(e){ p = {}; }
      p = p || {};
      var res = $('exResult');
      var ok = !!p.correct;
      res.classList.remove('hidden', 'ok', 'no');
      res.classList.add(ok ? 'ok' : 'no');
      var head = ok ? 'Correct' : 'Not quite';
      var body = bold(esc(String(p.md == null ? '' : p.md))).replace(/\n+/g, '<br>');
      res.innerHTML = '<div class="exResHead">' + head + '</div>' + body;
      // optional: mark which choice was right / wrong if indices are provided
      var ch = $('exChoices');
      if (ch.children.length && typeof p.correctIndex === 'number'){
        var ci = p.correctIndex, xi = p.chosenIndex;
        [].forEach.call(ch.children, function(b){
          var i = +b.dataset.i;
          if (i === ci) b.classList.add('correct');
          else if (typeof xi === 'number' && i === xi && xi !== ci) b.classList.add('wrong');
        });
      }
      $('exCheckBtn').classList.add('hidden');
      $('exNextBtn').classList.remove('hidden');
      $('exBody').scrollTop = $('exBody').scrollHeight;
    },
    /* close exercise mode - return to the normal answer pill */
    closeExercise(){
      document.body.classList.remove('exercise');
    }
  };

  $('fxBtn').addEventListener('click', () => {
    const d = $('fxDrop');
    $('idDrop').classList.add('hidden');
    if (d.classList.contains('hidden')){
      d.classList.remove('hidden');
      if (!fxItems.length){ XC.setFormulasLoading(); }
      post({type:'panel', k:'formulas'});
    } else { d.classList.add('hidden'); }
  });
  $('idBtn').addEventListener('click', () => {
    const d = $('idDrop');
    $('fxDrop').classList.add('hidden');
    if (d.classList.contains('hidden')){
      d.classList.remove('hidden');
      XC.setIdentsLoading();
      post({type:'panel', k:'idents'});
    } else { d.classList.add('hidden'); }
  });
  $('navBack').addEventListener('click', () => navTo(cursor - 1));
  $('navFwd').addEventListener('click', () => navTo(cursor + 1));
  $('copyBtn').addEventListener('click', () => post({type:'panel', k:'copy'}));
  $('woDoneBtn').addEventListener('click', () => post({type:'panel', k:'workoutcheck'}));
  $('woNextBtn').addEventListener('click', () => post({type:'panel', k:'workoutnext'}));
  $('closeBtn').addEventListener('click', () => post({type:'panel', k:'close'}));
  $('explain').addEventListener('click', () => post({type:'panel', k:'explain'}));
  $('defineBtn').addEventListener('click', () => { if (defineTerm) post({type:'panel', k:'define', term: defineTerm}); });
  $('simplifyBtn').addEventListener('click', () => post({type:'panel', k:'simplify'}));

  /* practice wiring */
  $('pracClose').addEventListener('click', closePractice);
  $('pracDoneBtn').addEventListener('click', closePractice);
  $('pracShowBtn').addEventListener('click', () => {
    $('pracBack').classList.remove('hidden');
    showRow('pracRateRow');
  });
  $('pracNextBtn').addEventListener('click', () => post({type:'panel', k:'practice', action:'practiceNext'}));
  $('pracSimplify').addEventListener('click', () => {
    if (!pracCard) return;
    XC.setCardHelpLoading();
    post({type:'panel', k:'practice', action:'simplify', cardId: pracCard.id});
  });
  document.querySelectorAll('#pracRateRow .pbtn').forEach((b) => {
    b.addEventListener('click', () => rateCard(+b.dataset.q));
  });

  /* exercise wiring */
  $('exCheckBtn').addEventListener('click', () => post({type:'panel', k:'workoutcheck'}));
  $('exNextBtn').addEventListener('click', () => post({type:'panel', k:'workoutnext'}));
  $('exEndBtn').addEventListener('click', () => post({type:'panel', k:'workoutend'}));

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (document.body.classList.contains('exercise')){ post({type:'panel', k:'workoutend'}); return; }
    if (document.body.classList.contains('practice')){ closePractice(); }
    else { post({type:'panel', k:'close'}); }
  });

  let dragOn = false, lx = 0, ly = 0;
  const interactive = (t) => t.closest('.ghost, .fbtn, #body, .chip, #practice, #exercise');
  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || interactive(e.target)) return;
    dragOn = true; lx = e.screenX; ly = e.screenY;
  });
  document.addEventListener('pointermove', (e) => {
    if (!dragOn) return;
    const dx = e.screenX - lx, dy = e.screenY - ly;
    if (dx === 0 && dy === 0) return;
    lx = e.screenX; ly = e.screenY;
    post({type:'drag', dx, dy});
  });
  document.addEventListener('pointerup', () => { dragOn = false; });

  /* cursor-tracking light shift */
  const sheen = $('sheen');
  document.addEventListener('mousemove', (e) => {
    sheen.style.transform = 'translate(' + (e.clientX - 160) + 'px,' + (e.clientY - 160) + 'px)';
  });

  XC.setTime(new Date().toTimeString().slice(0,5));
  post({type:'ready'});
</script>
</body>
</html>
